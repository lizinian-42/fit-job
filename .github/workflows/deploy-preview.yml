name: Deploy KWC preview

on:
  push:
    branches:
      - main
      - codex/issue-12-deploy-preview
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/kwc/fit-job-kwc
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: platform/kwc/fit-job-kwc/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate KWC package
        run: npm run check

      - name: Build static preview
        run: npm run build:preview

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload preview artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: platform/kwc/fit-job-kwc/preview-dist

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
